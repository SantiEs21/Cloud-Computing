<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashcam Encoder</title>
    <style>
      body { font-family: sans-serif; max-width: 760px; margin: 1em auto; padding: 0 1em; }
      fieldset { margin-bottom: 1em; }
      label { margin-right: 1em; }
      canvas { width: 100%; background: #000; }
      table { border-collapse: collapse; }
      td { padding: 2px 10px 2px 0; }
      .err { color: #b00; }
    </style>
  </head>
  <body>
    <h1>Dashcam Encoder</h1>
    <p id="config" class="err"></p>

    <fieldset>
      <label>Driver ID <input id="driver" value="driver-1" /></label><br /><br />
      <label><input type="radio" name="source" value="webcam" checked /> Webcam</label>
      <label><input type="radio" name="source" value="file" /> Video file</label>
      <input type="file" id="file" accept="video/*" /><br /><br />
      <label>Keep local segments (min) <input id="localMin" type="number" value="10" min="1" style="width:4em" /></label>
      <label>Keep server data (h) <input id="serverH" type="number" value="24" min="1" style="width:4em" /></label><br /><br />
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <label><input type="checkbox" id="offline" /> Simulate offline</label>
    </fieldset>

    <canvas id="canvas"></canvas>
    <video id="video" playsinline muted style="position:absolute; left:-9999px; width:320px"></video>

    <h2>Status</h2>
    <table>
      <tr><td>Trip ID</td><td id="trip">-</td></tr>
      <tr><td>Recording time</td><td id="time">0 s</td></tr>
      <tr><td>Frames captured</td><td id="frames">0</td></tr>
      <tr><td>Hashes generated</td><td id="hashes">0</td></tr>
      <tr><td>Rows sent</td><td id="sent">0</td></tr>
      <tr><td>Pending (queue)</td><td id="pending">0</td></tr>
      <tr><td>Network</td><td id="net">-</td></tr>
      <tr><td>Last upload latency</td><td id="latency">-</td></tr>
      <tr><td>Last error</td><td id="error" class="err"></td></tr>
      <tr><td>Last cleanup</td><td id="cleanup">-</td></tr>
    </table>

    <h2>Local segments</h2>
    <ul id="segments"></ul>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
